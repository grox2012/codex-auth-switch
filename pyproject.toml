[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-auth-switch"
version = "0.3.0"
description = "Safely switch local Codex accounts and recover broken provider configuration."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Wanya" }]
keywords = ["codex", "oauth", "account-switcher"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
codex-auth-switch = "codex_auth_switch.cli:main"

[project.urls]
Homepage = "https://github.com/grox2012/codex-auth-switch"
Repository = "https://github.com/grox2012/codex-auth-switch"
Issues = "https://github.com/grox2012/codex-auth-switch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_auth_switch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
